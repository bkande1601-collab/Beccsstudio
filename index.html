  <meta name="description" content="Chief of Staff · MSc IA & Data · Freelance Marketing Digital — Portfolio de Binta Kande" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
/* ===== TOKENS ===== */
:root {
  --bg: oklch(0.965 0.012 70);
  --bg-2: oklch(0.94 0.018 65);
  --fg: oklch(0.22 0.025 35);
  --fg-2: oklch(0.42 0.02 40);
  --fg-3: oklch(0.62 0.018 45);
  --line: oklch(0.86 0.018 60);
  --line-strong: oklch(0.78 0.022 55);
  --card: oklch(0.98 0.008 75);
  --accent: oklch(0.58 0.13 40);
  --accent-ink: oklch(0.97 0.01 70);
  --accent-soft: oklch(0.85 0.06 50);
  --serif: 'Fraunces', 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', 'Söhne Mono', ui-monospace, monospace;
  --container: 1280px;
  --gutter: clamp(20px, 4vw, 56px);
  --section-y: clamp(80px, 12vw, 160px);
}
[data-theme="dark"] {
  --bg: oklch(0.16 0.018 35);
  --bg-2: oklch(0.20 0.022 35);
  --fg: oklch(0.94 0.012 70);
  --fg-2: oklch(0.78 0.018 65);
  --fg-3: oklch(0.58 0.018 55);
  --line: oklch(0.28 0.022 40);
  --line-strong: oklch(0.36 0.025 45);
  --card: oklch(0.20 0.022 35);
  --accent: oklch(0.72 0.13 45);
  --accent-ink: oklch(0.16 0.018 35);
  --accent-soft: oklch(0.42 0.10 50);
}
html, body, .nav, .hero, .cos__card, .work__row, .stats__cell, .skills__chip,
.contact__field input, .contact__field select, .contact__field textarea {
  transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  cursor: none;
}
@media (max-width: 900px) { html, body { cursor: auto; } }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: none; }
input, select, textarea { font: inherit; color: inherit; }
ul { list-style: none; }

/* ===== UTILS ===== */
.container { max-width: var(--container); margin: 0 auto; padding: 0 var(--gutter); }
.serif-italic { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); font-size: 0.78em; letter-spacing: 0.04em; text-transform: uppercase; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 24px; }
.eyebrow--center { text-align: center; margin-bottom: 48px; }
.dot-pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }
.section-head { margin-bottom: clamp(48px, 8vw, 96px); max-width: 880px; }
.section-title { font-family: var(--sans); font-size: clamp(36px, 5.4vw, 76px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 500; margin-bottom: 24px; }
.section-intro { font-family: var(--serif); font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; color: var(--fg-2); max-width: 640px; }
.prose { font-size: 17px; line-height: 1.7; color: var(--fg-2); margin-bottom: 20px; max-width: 60ch; }

/* ===== CURSOR ===== */
.cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; border-radius: 50%; mix-blend-mode: difference; }
.cursor-dot { width: 6px; height: 6px; background: oklch(0.97 0.01 70); transform: translate(-50%, -50%); }
.cursor-ring { width: 36px; height: 36px; border: 1px solid oklch(0.97 0.01 70); transform: translate(-50%, -50%); transition: width 0.3s ease, height 0.3s ease, background 0.3s ease; }
.cursor-ring.is-hover { width: 64px; height: 64px; background: oklch(0.97 0.01 70 / 0.15); }

/* ===== NAV ===== */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 20px var(--gutter); display: flex; align-items: center; justify-content: space-between; background: color-mix(in oklab, var(--bg) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid color-mix(in oklab, var(--line) 40%, transparent); }
.nav__brand { display: flex; align-items: center; }
.nav__brand-logo { height: 36px; width: auto; display: block; }
.nav__links { display: flex; gap: 28px; font-size: 13px; }
.nav__link { color: var(--fg-2); position: relative; padding: 6px 0; }
.nav__link::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1px; background: var(--accent); transition: right 0.3s ease; }
.nav__link:hover::after, .nav__link.is-active::after { right: 0; }
.nav__link.is-active { color: var(--fg); }
.nav__right { display: flex; gap: 16px; align-items: center; }
.nav__toggle { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.nav__toggle button { padding: 8px 12px; color: var(--fg-3); }
.nav__toggle button.is-active { background: var(--fg); color: var(--bg); }
.nav__theme { width: 36px; height: 36px; border: 1px solid var(--line-strong); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
@media (max-width: 760px) { .nav__links { display: none; } }

/* ===== BUTTONS ===== */
.btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: 0.01em; white-space: nowrap; }
.btn span { transition: transform 0.3s ease; display: inline-block; }
.btn:hover span { transform: translateX(4px); }
.btn--primary { background: var(--fg); color: var(--bg); }
.btn--ghost { border: 1px solid var(--line-strong); color: var(--fg); }
.btn--ghost:hover { border-color: var(--fg); }

/* ===== HERO ===== */
.hero { min-height: 100vh; position: relative; display: flex; align-items: center; padding: 120px var(--gutter) 80px; overflow: hidden; }
.hero__orb { position: absolute; top: -10%; right: -10%; width: 70vw; height: 70vw; max-width: 900px; max-height: 900px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--accent), transparent 65%); opacity: 0.22; filter: blur(40px); transition: transform 1.2s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.hero__split-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: clamp(40px, 6vw, 80px); align-items: center; width: 100%; max-width: var(--container); margin: 0 auto; position: relative; z-index: 2; }
.hero__split-name { font-family: var(--sans); font-size: clamp(64px, 10vw, 152px); line-height: 0.92; letter-spacing: -0.04em; font-weight: 500; margin: 16px 0 32px; }
.hero__subtitle { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 20px; line-height: 1.6; }
.hero__description { font-family: var(--serif); font-size: clamp(18px, 1.7vw, 22px); line-height: 1.5; color: var(--fg-2); max-width: 520px; margin-bottom: 28px; }
.hero__mantra { font-size: clamp(20px, 2vw, 28px); color: var(--accent); margin-bottom: 32px; }
.hero__cta-row { display: flex; gap: 16px; flex-wrap: wrap; }
.hero__visual { display: flex; align-items: center; justify-content: center; position: relative; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.hero__visual-disc { position: relative; width: clamp(260px, 32vw, 440px); height: clamp(260px, 32vw, 440px); border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--accent-soft), var(--accent)); display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 80px -20px color-mix(in oklab, var(--accent) 40%, transparent); }
.hero__visual-mono { font-family: var(--serif); font-style: italic; font-size: clamp(80px, 10vw, 140px); color: var(--accent-ink); letter-spacing: -0.04em; transition: opacity 0.4s ease; }
.hero__visual-photo { position: absolute; inset: 12%; border-radius: 50%; background: repeating-linear-gradient(45deg, color-mix(in oklab, var(--accent) 70%, var(--bg)), color-mix(in oklab, var(--accent) 70%, var(--bg)) 10px, color-mix(in oklab, var(--accent) 50%, var(--bg)) 10px, color-mix(in oklab, var(--accent) 50%, var(--bg)) 20px); display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.92); transition: opacity 0.4s ease, transform 0.5s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.hero__visual-ring { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); animation: rotate 24s linear infinite; }
.hero__visual-text { font-family: var(--mono); font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; fill: var(--fg-2); }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.hero--giant .hero__giant-wrap { position: relative; z-index: 2; width: 100%; max-width: var(--container); margin: 0 auto; }
.hero__giant-name { font-family: var(--sans); font-size: clamp(80px, 18vw, 280px); line-height: 0.85; letter-spacing: -0.05em; font-weight: 500; margin: 24px 0 40px; display: flex; flex-direction: column; }
.hero__giant-name .serif-italic { color: var(--accent); }
.hero__giant-meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; margin-bottom: 40px; flex-wrap: wrap; }
.hero--asym .hero__asym-grid { width: 100%; max-width: var(--container); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 32px 60px; align-items: end; position: relative; z-index: 2; }
.hero__asym-left { grid-column: 1; grid-row: 1; }
.hero__asym-right { grid-column: 2; grid-row: 1 / 3; align-self: end; padding-bottom: 20px; }
.hero__asym-portrait { grid-column: 1; grid-row: 2; }
.hero__asym-name { font-family: var(--sans); font-size: clamp(72px, 12vw, 200px); line-height: 0.9; letter-spacing: -0.04em; font-weight: 500; }
.hero__asym-name .serif-italic { color: var(--accent); }
.portrait-slot { width: 100%; aspect-ratio: 4/5; max-height: 420px; background: repeating-linear-gradient(45deg, var(--bg-2), var(--bg-2) 12px, color-mix(in oklab, var(--accent-soft) 30%, var(--bg-2)) 12px, color-mix(in oklab, var(--accent-soft) 30%, var(--bg-2)) 24px); border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
.portrait-mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); background: var(--bg); padding: 6px 14px; border-radius: 999px; }
.hero__scroll-hint { position: absolute; bottom: 32px; left: var(--gutter); font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-3); }
@media (max-width: 880px) {
  .hero__split-grid { grid-template-columns: 1fr; }
  .hero__split-right { display: none; }
  .hero--asym .hero__asym-grid { grid-template-columns: 1fr; }
  .hero__asym-right { grid-column: 1; grid-row: auto; }
  .hero__asym-portrait { grid-column: 1; grid-row: auto; }
}

/* ===== MARQUEE ===== */
.marquee { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; padding: 24px 0; background: var(--bg-2); }
.marquee__track { display: flex; gap: 40px; white-space: nowrap; animation: marquee 40s linear infinite; width: max-content; }
.marquee__item { font-family: var(--serif); font-style: italic; font-size: clamp(32px, 5vw, 60px); color: var(--fg); letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 40px; }
.marquee__sep { color: var(--accent); font-size: 0.7em; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-33.333%); } }

/* ===== MANIFESTO ===== */
.manifesto { padding: var(--section-y) 0; background: color-mix(in oklab, var(--accent-soft) 35%, var(--bg)); position: relative; overflow: hidden; }
.manifesto__bg-word { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); font-family: var(--serif); font-style: italic; font-size: clamp(80px, 12vw, 180px); line-height: 0.85; letter-spacing: -0.04em; color: color-mix(in oklab, var(--accent) 22%, transparent); white-space: nowrap; pointer-events: none; user-select: none; font-weight: 400; transition: transform 0.1s linear; z-index: 0; }
.manifesto__inner { position: relative; z-index: 1; display: grid; grid-template-columns: 80px 1fr; gap: 40px; align-items: start; }
.manifesto__side { position: sticky; top: 120px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.manifesto__quote-mark { font-size: 120px; line-height: 0.7; color: var(--accent); display: block; }
.manifesto__label { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--fg-3); font-size: 11px; letter-spacing: 0.24em; margin-top: 12px; }
.manifesto__text { font-size: clamp(32px, 5vw, 72px); line-height: 1.15; letter-spacing: -0.025em; color: var(--fg); font-weight: 400; font-family: var(--serif); max-width: 22ch; }
.manifesto__big { display: inline; }
.manifesto__kw { color: var(--accent); font-style: italic; position: relative; display: inline-block; }
.manifesto__kw::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0.08em; height: 0.18em; background: color-mix(in oklab, var(--accent) 30%, transparent); z-index: -1; border-radius: 2px; }
.manifesto__sign { margin-top: 56px; display: flex; align-items: center; gap: 24px; font-size: 18px; color: var(--fg-2); flex-wrap: wrap; }
.manifesto__rule { flex: 1; height: 1px; background: var(--line-strong); min-width: 40px; max-width: 200px; }
@media (max-width: 760px) {
  .manifesto__inner { grid-template-columns: 1fr; gap: 24px; }
  .manifesto__side { position: static; flex-direction: row; align-items: center; }
  .manifesto__label { writing-mode: horizontal-tb; transform: none; margin-top: 0; }
  .manifesto__quote-mark { font-size: 80px; }
}

/* ===== ABOUT ===== */
.about { padding: var(--section-y) 0; overflow: hidden; }
.about__grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: clamp(40px, 6vw, 80px); align-items: start; }
.about__facts { border-top: 1px solid var(--line); display: grid; }
.about__fact { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--line); gap: 16px; }
.about__fact-key { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.about__fact-val { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--fg); text-align: right; }
@media (max-width: 880px) { .about__grid { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
}

/* ===== CHIEF OF STAFF ===== */
.cos { padding: var(--section-y) 0; background: var(--bg-2); }
.cos__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cos__card { background: var(--bg-2); padding: 36px 32px; display: flex; flex-direction: column; gap: 12px; transition: background 0.3s ease; }
.cos__card:hover { background: var(--bg); }
.cos__card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.cos__num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: var(--fg-3); }
.cos__tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); padding: 4px 10px; border-radius: 999px; }
.cos__title { font-family: var(--serif); font-size: 26px; font-weight: 500; line-height: 1.2; letter-spacing: -0.01em; color: var(--fg); }
.cos__body { color: var(--fg-2); font-size: 15px; line-height: 1.6; }
@media (max-width: 880px) { .cos__grid { grid-template-columns: 1fr; } }

/* ===== SERVICES ===== */
.services { padding: var(--section-y) 0; }
.services__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.services__card { border: 1px solid var(--line); border-radius: 16px; padding: 36px; background: var(--card); transition: transform 0.5s cubic-bezier(.2,.8,.2,1), border-color 0.3s ease, box-shadow 0.4s ease; position: relative; overflow: hidden; }
.services__card::before { content: ""; position: absolute; inset: -2px; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), color-mix(in oklab, var(--accent) 18%, transparent), transparent 60%); opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
.services__card:hover { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 24px 50px -20px color-mix(in oklab, var(--accent) 30%, transparent); }
.services__card:hover::before { opacity: 1; }
.services__card:hover .services__num { color: var(--accent); }
.services__card:hover .services__title { transform: translateX(4px); }
.services__title { transition: transform 0.4s cubic-bezier(.2,.8,.2,1); }
.services__card-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.services__num { color: var(--fg-3); font-size: 11px; }
.services__title { font-family: var(--serif); font-style: italic; font-size: 28px; font-weight: 400; letter-spacing: -0.01em; }
.services__list { display: flex; flex-direction: column; gap: 12px; }
.services__list li { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--fg-2); }
.services__bullet { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
@media (max-width: 760px) { .services__grid { grid-template-columns: 1fr; } }

/* ===== STATS ===== */
.stats { padding: var(--section-y) 0; background: var(--fg); color: var(--bg); }
.stats__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.stats__cell { padding: 24px 32px; border-left: 1px solid color-mix(in oklab, var(--bg) 20%, transparent); }
.stats__cell:first-child { border-left: 0; }
.stats__value { font-size: clamp(48px, 6vw, 88px); line-height: 1; margin-bottom: 16px; color: var(--bg); font-style: italic; }
.stats__label { font-size: 16px; margin-bottom: 8px; }
.stats__sub { color: color-mix(in oklab, var(--bg) 60%, transparent); }
@media (max-width: 880px) {
  .stats__grid { grid-template-columns: repeat(2, 1fr); }
  .stats__cell:nth-child(3) { border-left: 0; }
}

/* ===== WORK ===== */
.work { padding: var(--section-y) 0; background: var(--bg-2); }
.work__list { border-top: 1px solid var(--line-strong); }
.work__row { border-bottom: 1px solid var(--line-strong); transition: background 0.3s ease; }
.work__row.is-open { background: var(--bg); }
.work__head { width: 100%; display: grid; grid-template-columns: 60px 1.6fr 1.4fr 1.2fr 32px; align-items: center; gap: 24px; padding: 32px 16px; text-align: left; }
.work__num { color: var(--fg-3); }
.work__client { font-family: var(--serif); font-style: italic; font-size: clamp(24px, 2.6vw, 36px); letter-spacing: -0.01em; color: var(--fg); }
.work__role { font-size: 14px; color: var(--fg-2); }
.work__type { color: var(--fg-3); }
.work__icon { font-size: 22px; color: var(--accent); font-family: var(--serif); text-align: right; transition: transform 0.4s ease; }
.work__row.is-open .work__icon { transform: rotate(180deg); }
.work__panel { overflow: hidden; transition: max-height 0.6s cubic-bezier(.2,.8,.2,1); }
.work__panel-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 0 16px 48px; }
.work__teaser { font-family: var(--serif); font-size: 22px; line-height: 1.4; color: var(--fg); margin-bottom: 24px; font-style: italic; }
.work__scope { display: flex; flex-direction: column; gap: 10px; }
.work__scope li { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--fg-2); }
.work__visual { width: 100%; aspect-ratio: 16/10; background: repeating-linear-gradient(-45deg, var(--bg-2), var(--bg-2) 10px, color-mix(in oklab, var(--accent-soft) 30%, var(--bg-2)) 10px, color-mix(in oklab, var(--accent-soft) 30%, var(--bg-2)) 20px); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; border: 1px solid var(--line); }
.work__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.work__stat { border-top: 1px solid var(--line); padding-top: 12px; }
.work__stat-val { font-size: 32px; line-height: 1; color: var(--accent); margin-bottom: 6px; }
.work__stat-label { font-size: 10px; color: var(--fg-3); }
.work__project-title { font-family: var(--serif); font-size: clamp(20px, 2.2vw, 28px); line-height: 1.2; color: var(--fg); margin-bottom: 16px; }
.work__tag-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (<><div className="twk-sect">{label}</div>{children}</>);
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const trackRef = React.useRef(null);
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    onChange(segAt(e.clientX));
    const move = (ev) => { const v = segAt(ev.clientX); if (v !== value) onChange(v); };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} className="twk-seg" onPointerDown={onPointerDown}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button">{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return <option key={v} value={v}>{l}</option>; })}
      </select>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  const __twkIsLight = (hex) => {
    const h = String(hex).replace('#', '');
    const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
    const n = parseInt(x.slice(0, 6), 16);
    if (Number.isNaN(n)) return true;
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return r * 299 + g * 587 + b * 114 > 148000;
  };
  return (
    <TweakRow label={label}>
      <div className="twk-chips">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero] = colors;
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on ? '1' : '0'} style={{ background: hero }} onClick={() => onChange(o)}>
              {on && <svg viewBox="0 0 14 14"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke={__twkIsLight(hero) ? 'rgba(0,0,0,.78)' : '#fff'} /></svg>}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

// ─── Reveal + Magnetic ────────────────────────────────────────────────────────
function Reveal({ children, delay = 0, y = 24, className = "" }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } },
      { threshold: 0.15, rootMargin: "0px 0px -10% 0px" }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} className={className} style={{ opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : `translateY(${y}px)`, transition: `opacity 1.1s cubic-bezier(.2,.8,.2,1) ${delay}ms, transform 1.1s cubic-bezier(.2,.8,.2,1) ${delay}ms` }}>
      {children}
    </div>
  );
}

function Magnetic({ children, strength = 0.25, className = "", ...props }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.transform = `translate(${(e.clientX - (r.left + r.width / 2)) * strength}px, ${(e.clientY - (r.top + r.height / 2)) * strength}px)`;
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = "translate(0,0)"; };
  return (
    <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className={className} style={{ transition: "transform 0.4s cubic-bezier(.2,.8,.2,1)", display: "inline-block" }} {...props}>
      {children}
    </div>
  );
}

// ─── Manifesto ────────────────────────────────────────────────────────────────
function Manifesto({ t }) {
  const [scroll, setScroll] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      if (!ref.current) return;
      const r = ref.current.getBoundingClientRect();
      const progress = 1 - (r.top + r.height) / (window.innerHeight + r.height);
      setScroll(Math.max(0, Math.min(1, progress)));
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const fullText = t.heroDescription;
  const keywords = ["Digital", "IA", "AI", "créativité", "stratégie", "creativity", "strategy"];
  const tokens = fullText.split(/(\s+)/);
  return (
    <section ref={ref} className="manifesto">
      <div className="manifesto__bg-word" style={{ transform: `translateX(${-15 + scroll * 30}%)` }}>BINTA · KANDE</div>
      <div className="container manifesto__inner">
        <div className="manifesto__side">
          <span className="manifesto__quote-mark serif-italic">"</span>
          <span className="mono manifesto__label">Manifesto</span>
        </div>
        <Reveal>
          <p className="manifesto__text">
            {tokens.map((tok, i) => {
              const clean = tok.replace(/[^\p{L}]/gu, "");
              const isKw = keywords.some(k => clean.toLowerCase() === k.toLowerCase());
              return <span key={i} className={isKw ? "manifesto__big manifesto__kw serif-italic" : "manifesto__big"}>{tok}</span>;
            })}
          </p>
          <div className="manifesto__sign">
            <span className="serif-italic">Binta K.</span>
            <span className="manifesto__rule" />
            <span className="mono">Becc's Studio · 2026</span>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

// ─── Lightbox ─────────────────────────────────────────────────────────────────
function Lightbox({ images, startIndex, onClose }) {
  const [idx, setIdx] = useState3(startIndex);
  useEffect3(() => {
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowRight") setIdx(i => (i + 1) % images.length);
      if (e.key === "ArrowLeft") setIdx(i => (i - 1 + images.length) % images.length);
    };
    window.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [images.length, onClose]);
  return (
    <div className="lb is-open" onClick={onClose}>
      <button className="lb__close" onClick={onClose}>×</button>
      <button className="lb__nav lb__prev" onClick={e => { e.stopPropagation(); setIdx(i => (i - 1 + images.length) % images.length); }}>‹</button>
      <img className="lb__img" src={images[idx]} alt="" onClick={e => e.stopPropagation()} />
      <button className="lb__nav lb__next" onClick={e => { e.stopPropagation(); setIdx(i => (i + 1) % images.length); }}>›</button>
      <div className="lb__counter">{idx + 1} / {images.length}</div>
    </div>
  );
}

// ─── Custom Cursor ────────────────────────────────────────────────────────────
function CustomCursor() {
  const dotRef = useRefApp(null);
  const ringRef = useRefApp(null);
  useEffectApp(() => {
    let dotX = 0, dotY = 0, ringX = 0, ringY = 0, mx = 0, my = 0;
    const move = (e) => { mx = e.clientX; my = e.clientY; };
    window.addEventListener("mousemove", move);
    let raf;
    const tick = () => {
      dotX += (mx - dotX) * 0.6; dotY += (my - dotY) * 0.6;
      ringX += (mx - ringX) * 0.18; ringY += (my - ringY) * 0.18;
      if (dotRef.current) dotRef.current.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;
      if (ringRef.current) ringRef.current.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
      raf = requestAnimationFrame(tick);
    };
    tick();
    const updateHover = () => {
      const el = document.elementFromPoint(mx, my);
      const isHover = el && el.closest("a, button, [data-cursor-hover]");
      if (ringRef.current) ringRef.current.classList.toggle("is-hover", !!isHover);
    };
    const hoverInterval = setInterval(updateHover, 50);
    return () => { window.removeEventListener("mousemove", move); cancelAnimationFrame(raf); clearInterval(hoverInterval); };
  }, []);
  return (<><div ref={ringRef} className="cursor-ring" /><div ref={dotRef} className="cursor-dot" /></>);
}

  const items = [
    { id: "home", label: navLabels[0] }, { id: "about", label: navLabels[1] },
    { id: "cos", label: navLabels[2] }, { id: "services", label: navLabels[3] },
    { id: "work", label: navLabels[4] }, { id: "contact", label: navLabels[5] },
  ];
  return (
    <nav className="nav">
      <a href="#home" className="nav__brand"><img src="logo.png" alt="Becc's Studio" className="nav__brand-logo" /></a>
      <div className="nav__links">
        {items.map((it) => <a key={it.id} href={`#${it.id}`} className={`nav__link ${active === it.id ? "is-active" : ""}`}>{it.label}</a>)}
      </div>
      <div className="nav__right">
        <div className="nav__toggle">
          <button className={lang === "fr" ? "is-active" : ""} onClick={() => setLang("fr")}>FR</button>
          <button className={lang === "en" ? "is-active" : ""} onClick={() => setLang("en")}>EN</button>
        </div>
        <button className="nav__theme" onClick={() => setTheme(theme === "light" ? "dark" : "light")} aria-label="Toggle theme">
          {theme === "light" ? "☾" : "☀"}
        </button>
      </div>
    </nav>
  );
}

// ─── Accent & Font options ────────────────────────────────────────────────────
const TWEAK_DEFAULTS = { heroVariant: "split", accent: "terracotta", fontStack: "fraunces", theme: "light", lang: "fr" };
const ACCENT_OPTIONS = {
  terracotta: { light: "oklch(0.58 0.13 40)", soft: "oklch(0.85 0.06 50)", dark: "oklch(0.72 0.13 45)", darkSoft: "oklch(0.42 0.10 50)" },
  sage:       { light: "oklch(0.55 0.06 145)", soft: "oklch(0.85 0.04 140)", dark: "oklch(0.72 0.07 145)", darkSoft: "oklch(0.42 0.05 145)" },
  cobalt:     { light: "oklch(0.50 0.14 250)", soft: "oklch(0.82 0.06 245)", dark: "oklch(0.70 0.14 250)", darkSoft: "oklch(0.40 0.10 250)" },
  plum:       { light: "oklch(0.45 0.12 340)", soft: "oklch(0.82 0.06 335)", dark: "oklch(0.68 0.13 340)", darkSoft: "oklch(0.38 0.10 340)" },
};
const FONT_OPTIONS = {
  fraunces:   { serif: "'Fraunces', Georgia, serif", sans: "'Inter', sans-serif" },
  instrument: { serif: "'Instrument Serif', Georgia, serif", sans: "'Geist', 'Inter', sans-serif" },
  domaine:    { serif: "'DM Serif Display', Georgia, serif", sans: "'Geist', 'Inter', sans-serif" },
};

function MyTweaks({ tweaks, setTweak }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Hero">
        <TweakSelect label="Layout" value={tweaks.heroVariant} onChange={(v) => setTweak("heroVariant", v)}
          options={[{ value: "split", label: "Split (default)" }, { value: "giant", label: "Giant typo" }, { value: "asymmetric", label: "Asymmetric" }]} />
      </TweakSection>
      <TweakSection label="Color">
        <TweakColor label="Accent" value={tweaks.accent} onChange={(v) => setTweak("accent", v)}
          options={[{ value: "terracotta", color: "#C56A45" }, { value: "sage", color: "#7A9379" }, { value: "cobalt", color: "#3D6BB8" }, { value: "plum", color: "#8B4068" }]} />
        <TweakRadio label="Theme" value={tweaks.theme} onChange={(v) => setTweak("theme", v)}
          options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]} />
      </TweakSection>
      <TweakSection label="Type">
        <TweakSelect label="Font pairing" value={tweaks.fontStack} onChange={(v) => setTweak("fontStack", v)}
          options={[{ value: "fraunces", label: "Fraunces × Inter" }, { value: "instrument", label: "Instrument × Geist" }, { value: "domaine", label: "DM Serif × Geist" }]} />
      </TweakSection>
      <TweakSection label="Language">
        <TweakRadio label="Lang" value={tweaks.lang} onChange={(v) => setTweak("lang", v)}
          options={[{ value: "fr", label: "FR" }, { value: "en", label: "EN" }]} />
      </TweakSection>
    </TweaksPanel>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [lang, setLang] = useStateApp(tweaks.lang || "fr");
  const [theme, setTheme] = useStateApp(tweaks.theme || "light");

  useEffectApp(() => { if (tweaks.lang && tweaks.lang !== lang) setLang(tweaks.lang); }, [tweaks.lang]);
  useEffectApp(() => { if (tweaks.theme && tweaks.theme !== theme) setTheme(tweaks.theme); }, [tweaks.theme]);
  useEffectApp(() => { if (lang !== tweaks.lang) setTweak("lang", lang); }, [lang]);
  useEffectApp(() => { if (theme !== tweaks.theme) setTweak("theme", theme); }, [theme]);
  useEffectApp(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);
  useEffectApp(() => {
    const a = ACCENT_OPTIONS[tweaks.accent] || ACCENT_OPTIONS.terracotta;
    const root = document.documentElement;
    root.style.setProperty("--accent", theme === "dark" ? a.dark : a.light);
    root.style.setProperty("--accent-soft", theme === "dark" ? a.darkSoft : a.soft);
  }, [tweaks.accent, theme]);
  useEffectApp(() => {
    const f = FONT_OPTIONS[tweaks.fontStack] || FONT_OPTIONS.fraunces;
    document.documentElement.style.setProperty("--serif", f.serif);
    document.documentElement.style.setProperty("--sans", f.sans);
  }, [tweaks.fontStack]);

  const t = CONTENT[lang];
  const marqueeItems = ["Chief of Staff", "Digital Marketing", "Automations", "IA & Data", "Brand strategy", "Content design", "Editorial", "Available Q3 2026"];

  return (
    <>
      <CustomCursor />
      <Nav lang={lang} setLang={setLang} theme={theme} setTheme={setTheme} navLabels={t.nav} />
      <main>
        <Hero t={t} heroVariant={tweaks.heroVariant} />
        <Marquee items={marqueeItems} />
        <Manifesto t={t} />
        <About t={t} />
        <ChiefOfStaff t={t} />
        <Services t={t} />
        <Stats t={t} />
        <CaseStudies t={t} />
        <Skills t={t} />
        <Process t={t} />
        <Blog t={t} />
        <Contact t={t} />
        <Footer t={t} />
      </main>
      <MyTweaks tweaks={tweaks} setTweak={setTweak} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
